<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f6f5f1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Todo</title>
    <!-- the saved theme before the first paint – no flash of the wrong one -->
    <script>try{var t=localStorage.getItem('todo:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
